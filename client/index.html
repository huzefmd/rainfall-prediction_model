<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainfall Predictor</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="card" id="auth-card">
      <h2 style="text-align: center" id="form-title">Login</h2>
      <form id="auth-form">
        <input
          class="input"
          type="text"
          name="username"
          placeholder="Username"
          required
        />
        <input
          class="input"
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit" id="auth-btn">Login</button>
      </form>
      <div class="toggle">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-btn">Signup</button>
      </div>
      <p class="message" id="message"></p>
    </div>

    <div class="card" id="predict-card" style="display: none">
      <h2 style="text-align: center">Rainfall Prediction</h2>
      <form id="predict-form">
        <input
          class="input"
          type="number"
          name="temperature"
          placeholder="Pressure"
          required
        />
        <input
          class="input"
          type="number"
          name="humidity"
          placeholder="Dewpoint"
          required
        />
        <input
          class="input"
          type="number"
          name="windSpeed"
          placeholder="Humidity"
          required
        />
        <input
          class="input"
          type="number"
          name="pressure"
          placeholder="Cloud"
          required
        />
        <input
          class="input"
          type="number"
          name="feature5"
          placeholder="Sunshine"
          required
        />
        <input
          class="input"
          type="number"
          name="feature6"
          placeholder="Wind Direction "
          required
        />
        <input
          class="input"
          type="number"
          name="feature7"
          placeholder="Wind Speed"
          required
        />
        <button type="submit">Predict</button>
      </form>
      <h3 id="result" style="text-align: center; margin-top: 20px"></h3>
    </div>
    <div id="loading">🔄 Predicting...</div>
    <div id="toast">Prediction successful!</div>

    <script src="index.js"></script>
  </body>
</html>

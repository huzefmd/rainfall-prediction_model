<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainfall Predictor</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-image: url("https://images.unsplash.com/photo-1741851374674-e4b7e573a9e7?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        max-width: 400px;
        width: 100%;
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        background-color: rgba(255, 255, 255, 0.15);
        color: black;
      }

      .input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: none;
        outline: none;
      }
      input::placeholder{
        color: black;
      }

      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        background-color: #1e90ff;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }

      .toggle {
        margin-top: 15px;
        text-align: center;
      }

      .toggle button {
        background: none;
        color: #00f;
        border: none;
        cursor: pointer;
        margin-left: 5px;
        font-weight: bold;
        text-decoration: underline;
      }

      .message {
        color: #ff4d4d;
        text-align: center;
        margin-top: 10px;
      }
      #loading {
        display: none;
        text-align: center;
        font-weight: bold;
        color: #fff;
        margin-top: 20px;
      }

      #toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #1e90ff;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 999;
      }

      .result-image {
        display: block;
        margin: 20px auto;
        max-width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="auth-card">
      <h2 style="text-align: center" id="form-title">Login</h2>
      <form id="auth-form">
        <input
          class="input"
          type="text"
          name="username"
          placeholder="Username"
          required
        />
        <input
          class="input"
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit" id="auth-btn">Login</button>
      </form>
      <div class="toggle">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-btn">Signup</button>
      </div>
      <p class="message" id="message"></p>
    </div>

    <div class="card" id="predict-card" style="display: none">
      <h2 style="text-align: center">Rainfall Prediction</h2>
      <form id="predict-form">
        <input
          class="input"
          type="number"
          name="temperature"
          placeholder="Pressure"
          required
        />
        <input
          class="input"
          type="number"
          name="humidity"
          placeholder="Dewpoint"
          required
        />
        <input
          class="input"
          type="number"
          name="windSpeed"
          placeholder="Humidity"
          required
        />
        <input
          class="input"
          type="number"
          name="pressure"
          placeholder="Cloud"
          required
        />
        <input
          class="input"
          type="number"
          name="feature5"
          placeholder="Sunshine"
          required
        />
        <input
          class="input"
          type="number"
          name="feature6"
          placeholder="Wind Direction "
          required
        />
        <input
          class="input"
          type="number"
          name="feature7"
          placeholder="Wind Speed"
          required
        />
        <button type="submit">Predict</button>
      </form>
      <h3 id="result" style="text-align: center; margin-top: 20px"></h3>
    </div>
    <div id="loading">🔄 Predicting...</div>
    <div id="toast">Prediction successful!</div>

    <script>
      const authForm = document.getElementById("auth-form");
      const authCard = document.getElementById("auth-card");
      const predictCard = document.getElementById("predict-card");
      const predictForm = document.getElementById("predict-form");
      const authBtn = document.getElementById("auth-btn");
      const formTitle = document.getElementById("form-title");
      const toggleBtn = document.getElementById("toggle-btn");
      const toggleText = document.getElementById("toggle-text");
      const message = document.getElementById("message");
      const result = document.getElementById("result");

      let isLogin = true;

      toggleBtn.addEventListener("click", () => {
        isLogin = !isLogin;
        formTitle.innerText = isLogin ? "Login" : "Signup";
        authBtn.innerText = isLogin ? "Login" : "Signup";
        toggleText.innerText = isLogin
          ? "Don't have an account?"
          : "Already have an account?";
        toggleBtn.innerText = isLogin ? "Signup" : "Login";
      });

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(authForm);
        const payload = Object.fromEntries(data.entries());
        try {
          const response = await fetch(
            `http://localhost:5000/${isLogin ? "login" : "signup"}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            }
          );
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          message.textContent = result.message;
          authCard.style.display = "none";
          predictCard.style.display = "block";
        } catch (err) {
          message.textContent = err.message;
        }
      });
      predictForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(predictForm);
        const payload = Object.fromEntries(data.entries());

        // Show loader and hide result
        document.getElementById("loading").style.display = "block";
        result.innerText = "";
        result.innerHTML = "";

        try {
          const response = await fetch("http://localhost:5000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const resData = await response.json();

          document.getElementById("loading").style.display = "none";

          // Show toast
          showToast("Prediction successful!");

          // Show result
          const prediction = resData.prediction;
          result.innerHTML = `<h3>Prediction: ${prediction}</h3>`;

          if (prediction == 0) {
            result.innerHTML += `<p style="font-size:40px;">☀️</p><p>No Rain Expected</p>`;
            // You can also use image instead of emoji:
            // result.innerHTML += `<img src="sun.png" class="result-image" alt="No Rain" />`;
          } else if (prediction == 1) {
            result.innerHTML += `<p style="font-size:40px;">🌧️</p><p>Rain Expected</p>`;
            // result.innerHTML += `<img src="rain.png" class="result-image" alt="Rain Expected" />`;
          }
        } catch (err) {
          document.getElementById("loading").style.display = "none";
          result.innerText = "Prediction Failed!";
        }
      });

      // Toast function
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.style.display = "block";
        setTimeout(() => {
          toast.style.display = "none";
        }, 3000);
      }
    </script>
  </body>
</html>
